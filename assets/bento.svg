<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="760" viewBox="0 0 1000 760" role="img" aria-label="Aditya Kumar K, Blockchain Engineer. Solidity on BNB Smart Chain, Claude Code pair programming, Linux and KDE apps. Featured projects: axionova-solidity-defi-contracts, Axionova network, Roost-Xplorer, serien-music-player.">
  <style>
    .s{font-family:system-ui,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}
    .m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .t{fill:#F5EDE0}.d{fill:#A8998A}.c{fill:#D97757}.g{fill:#F0B90B}
    .tile{fill:#1F1712;stroke:#F5EDE0;stroke-opacity:.09}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .dot{animation:pulse 1.8s ease-in-out infinite}
    .fl{animation:float 5s ease-in-out infinite}
    .fl2{animation:float 6s ease-in-out infinite;animation-delay:-2s}
    @media (prefers-reduced-motion:reduce){.dot,.fl,.fl2{animation:none}}
  </style>
  <defs>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D97757"/><stop offset="1" stop-color="#F0B90B"/></linearGradient>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D97757"/><stop offset="1" stop-color="#B5502F"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F0B90B"/><stop offset="1" stop-color="#C98F00"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2B1D15"/><stop offset="1" stop-color="#1F1712"/></linearGradient>
    <radialGradient id="glow" cx=".85" cy=".1" r=".8"><stop offset="0" stop-color="#D97757" stop-opacity=".35"/><stop offset="1" stop-color="#D97757" stop-opacity="0"/></radialGradient>
  </defs>

  <!-- ROW 1 -->
  <!-- hero -->
  <rect x="0" y="0" width="600" height="240" rx="22" fill="url(#hero)" stroke="#F5EDE0" stroke-opacity=".09"/>
  <rect x="0" y="0" width="600" height="240" rx="22" fill="url(#glow)"/>
  <g fill="none" stroke="url(#ac)" stroke-width="2" opacity=".75">
    <rect class="fl" x="470" y="40" width="52" height="52" rx="10"/>
    <rect class="fl2" x="530" y="80" width="52" height="52" rx="10"/>
    <rect class="fl" x="500" y="150" width="52" height="52" rx="10"/>
  </g>
  <text x="36" y="62" class="m c" font-size="15">gm, I'm</text>
  <text x="36" y="118" class="t" font-family="Georgia,'Times New Roman',serif" font-size="52" font-weight="700">Aditya Kumar K</text>
  <text x="36" y="152" class="s d" font-size="18">Blockchain engineer. I build smart contracts,</text>
  <text x="36" y="176" class="s d" font-size="18">and the apps and servers around them.</text>
  <rect x="36" y="196" width="108" height="26" rx="13" fill="#D97757" fill-opacity=".18"/><text x="90" y="214" class="m c" font-size="13" text-anchor="middle">Web3</text>
  <rect x="152" y="196" width="70" height="26" rx="13" fill="#D97757" fill-opacity=".18"/><text x="187" y="214" class="m c" font-size="13" text-anchor="middle">AI</text>
  <rect x="230" y="196" width="90" height="26" rx="13" fill="#D97757" fill-opacity=".18"/><text x="275" y="214" class="m c" font-size="13" text-anchor="middle">Linux</text>

  <!-- status -->
  <rect x="612" y="0" width="388" height="113" rx="22" class="tile"/>
  <circle class="dot" cx="644" cy="38" r="6" fill="#3FB950"/>
  <text x="662" y="43" class="s t" font-size="16" font-weight="600">Open to work</text>
  <text x="644" y="72" class="s d" font-size="14">Full-time, contract, collaborations</text>
  <text x="644" y="94" class="s d" font-size="14">Hyderabad, India · remote-friendly</text>

  <!-- stat -->
  <rect x="612" y="127" width="388" height="113" rx="22" fill="url(#gold)"/>
  <text x="640" y="190" font-family="Georgia,'Times New Roman',serif" font-size="64" font-weight="700" fill="#1B1612">12+</text>
  <text x="760" y="170" class="s" font-size="16" font-weight="600" fill="#1B1612">smart contracts</text>
  <text x="760" y="192" class="s" font-size="14" fill="#1B1612" fill-opacity=".75">staking, vesting, DAO,</text>
  <text x="760" y="212" class="s" font-size="14" fill="#1B1612" fill-opacity=".75">presale, migration</text>

  <!-- ROW 2 -->
  <rect x="0" y="254" width="326" height="190" rx="22" fill="url(#warm)"/>
  <text x="28" y="292" class="m" font-size="13" fill="#FFF" fill-opacity=".75">ON-CHAIN</text>
  <text x="28" y="350" font-family="Georgia,'Times New Roman',serif" font-size="46" font-weight="700" fill="#FFF">Solidity</text>
  <text x="28" y="384" class="s" font-size="15" fill="#FFF" fill-opacity=".9">BNB Smart Chain</text>
  <text x="28" y="408" class="s" font-size="15" fill="#FFF" fill-opacity=".9">Hardhat · OpenZeppelin · Chainlink</text>
  <text x="28" y="430" class="s" font-size="15" fill="#FFF" fill-opacity=".9">Ethers.js · EIP-712</text>

  <rect x="337" y="254" width="326" height="190" rx="22" class="tile"/>
  <text x="365" y="292" class="m c" font-size="13">AI PAIR</text>
  <text x="365" y="342" class="t" font-family="Georgia,'Times New Roman',serif" font-size="36" font-weight="700">Claude Code</text>
  <text x="365" y="376" class="s d" font-size="15">Vibecoded fast, reviewed line by line.</text>
  <text x="365" y="398" class="s d" font-size="15">A human signs anything that</text>
  <text x="365" y="418" class="s d" font-size="15">touches money.</text>

  <rect x="674" y="254" width="326" height="190" rx="22" class="tile"/>
  <text x="702" y="292" class="m c" font-size="13">DESKTOP</text>
  <text x="702" y="342" class="t" font-family="Georgia,'Times New Roman',serif" font-size="36" font-weight="700">Linux</text>
  <text x="702" y="376" class="s d" font-size="15">GTK 4, Electron, KDE Plasma</text>
  <text x="702" y="398" class="s d" font-size="15">widgets, and desktop</text>
  <text x="702" y="418" class="s d" font-size="15">customization.</text>

  <!-- ROW 3 label -->
  <text x="4" y="480" class="m c" font-size="13">FEATURED PROJECTS</text>

  <!-- ROW 3 projects -->
  <g>
    <rect x="0" y="494" width="241" height="170" rx="22" class="tile"/>
    <rect x="22" y="516" width="34" height="34" rx="9" fill="url(#ac)"/>
    <text x="39" y="539" class="m" font-size="15" font-weight="700" fill="#1B1612" text-anchor="middle">01</text>
    <text x="22" y="580" class="s t" font-size="15" font-weight="700">axionova-solidity</text>
    <text x="22" y="600" class="s t" font-size="15" font-weight="700">-defi-contracts</text>
    <text x="22" y="628" class="s d" font-size="13">Modular DeFi on BSC</text>
    <text x="22" y="650" class="m g" font-size="12">Solidity · Hardhat</text>
  </g>
  <g>
    <rect x="253" y="494" width="241" height="170" rx="22" class="tile"/>
    <rect x="275" y="516" width="34" height="34" rx="9" fill="url(#ac)"/>
    <text x="292" y="539" class="m" font-size="15" font-weight="700" fill="#1B1612" text-anchor="middle">02</text>
    <text x="275" y="580" class="s t" font-size="15" font-weight="700">Axionova network</text>
    <text x="275" y="628" class="s d" font-size="13">Staking, DAO, explorer, games</text>
    <text x="275" y="650" class="m g" font-size="12">Chainlink · PHP 8</text>
  </g>
  <g>
    <rect x="506" y="494" width="241" height="170" rx="22" class="tile"/>
    <rect x="528" y="516" width="34" height="34" rx="9" fill="url(#ac)"/>
    <text x="545" y="539" class="m" font-size="15" font-weight="700" fill="#1B1612" text-anchor="middle">03</text>
    <text x="528" y="580" class="s t" font-size="15" font-weight="700">Roost-Xplorer</text>
    <text x="528" y="628" class="s d" font-size="13">Linux file manager</text>
    <text x="528" y="650" class="m g" font-size="12">Python · GTK 4</text>
  </g>
  <g>
    <rect x="759" y="494" width="241" height="170" rx="22" class="tile"/>
    <rect x="781" y="516" width="34" height="34" rx="9" fill="url(#ac)"/>
    <text x="798" y="539" class="m" font-size="15" font-weight="700" fill="#1B1612" text-anchor="middle">04</text>
    <text x="781" y="580" class="s t" font-size="15" font-weight="700">serien-music-player</text>
    <text x="781" y="628" class="s d" font-size="13">Visualizer + 5-band EQ</text>
    <text x="781" y="650" class="m g" font-size="12">Electron · Howler.js</text>
  </g>

  <!-- ROW 4 strip -->
  <rect x="0" y="678" width="1000" height="82" rx="22" class="tile"/>
  <text x="28" y="712" class="m c" font-size="13">ALSO</text>
  <text x="28" y="740" class="s d" font-size="15">Python · JavaScript · PHP 8 · Node.js · MySQL · WordPress · Netlify · Google Cloud · Nginx · Git</text>
</svg>
